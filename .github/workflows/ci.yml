name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Regenerate lock on the runner's OS so platform-specific optional
      # deps (rollup, esbuild, sharp) resolve for Linux. Avoids npm #4828.
      - run: rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
