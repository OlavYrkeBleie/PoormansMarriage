name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci misses platform-specific optional deps when the lock file was
      # generated on a different OS (npm issue #4828). Use npm install so the
      # platform rollup/esbuild binaries are picked up on Linux.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
